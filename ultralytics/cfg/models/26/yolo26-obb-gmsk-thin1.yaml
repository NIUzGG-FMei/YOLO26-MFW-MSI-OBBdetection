#
# GMSK-enhanced YOLO26-obb (thin1):
# - Remove the backbone P3/8 GMSKConv insertion.
# - Keep only the head-side P3 refinement GMSKConv.
# - Reduce GMSK sensitivity by lowering nbins from 180 to 32.
#
# Input-size analysis:
# - For an input of HxW, the main feature stages are:
#   P1/2:  H/2  x W/2
#   P2/4:  H/4  x W/4
#   P3/8:  H/8  x W/8   <- main small-object detection stage
#   P4/16: H/16 x W/16
#   P5/32: H/32 x W/32
# - For 256x256 patches, the stage sizes are:
#   P1=128x128, P2=64x64, P3=32x32, P4=16x16, P5=8x8
#
# GMSKConv parameter policy:
# - YAML writes GMSKConv as [nbins, cell_size]
# - parse_model() auto-expands it to [in_dim, nbins, cell_size]
# - This variant uses nbins=32, cell_size=(8,8) to reduce sensitivity to
#   fine-grained background edge textures.

# Parameters
nc: 80
end2end: True
reg_max: 1
scales:
  # [depth, width, max_channels]
  # depth affects the effective repeats of blocks with repeats > 1
  # width affects the effective output channels of channel-configured blocks
  n: [0.50, 0.25, 1024] # summary: 291 layers, 2,715,614 parameters, 2,715,614 gradients, 16.9 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 291 layers, 10,582,142 parameters, 10,582,142 gradients, 63.5 GFLOPs
  m: [0.50, 1.00, 512] # summary: 311 layers, 23,593,918 parameters, 23,593,918 gradients, 211.9 GFLOPs
  l: [1.00, 1.00, 512] # summary: 423 layers, 27,997,374 parameters, 27,997,374 gradients, 259.0 GFLOPs
  x: [1.00, 1.50, 512] # summary: 423 layers, 62,811,678 parameters, 62,811,678 gradients, 578.9 GFLOPs

# Backbone
backbone:
  # [from, repeats, module, args]
  # Note:
  # - "-1" means use the previous layer output.
  # - All stride-2 Conv layers are preserved to keep the original pyramid.

  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2: shallow edge-sensitive stem, first downsampling
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4: still high-resolution, small-target texture remains rich
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4: low-level local feature extraction

  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8: enters the main small-object feature stage
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8: original small-target backbone aggregation block

  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16: medium-object stage, semantics increase and detail decreases
  - [-1, 2, C3k2, [512, True]] # 6-P4/16: same-scale residual aggregation
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32: deepest stage, strongest semantics, weakest small-target detail
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9-P5/32: enlarge receptive field
  - [-1, 2, C2PSA, [1024]] # 10-P5/32: high-level context attention

# Neck + Head
head:
  # Fusion stage 1: P5 upsample + backbone P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4/16
  - [-1, 2, C3k2, [512, True]] # 13 fused P4/16 feature

  # Fusion stage 2: P4 upsample + backbone P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3/8
  - [-1, 2, C3k2, [256, True]] # 16 P3/8-small: main small-object detection branch
  - [-1, 1, GMSKConv, [9, [4, 4]]] # 17 new: lower-sensitivity pre-head refinement for the small-object OBB branch

  # Bottom-up path aggregation back to P4
  - [-1, 1, Conv, [256, 3, 2]] # 18 downsample P3 -> P4, keep original path intact
  - [[-1, 13], 1, Concat, [1]] # 19 cat head P4
  - [-1, 2, C3k2, [512, True]] # 20 P4/16-medium

  # Bottom-up path aggregation back to P5
  - [-1, 1, Conv, [512, 3, 2]] # 21 downsample P4 -> P5
  - [[-1, 10], 1, Concat, [1]] # 22 cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23 P5/32-large

  # Final OBB head:
  # - P3 input index = 17 (small-object branch, GMSK-refined)
  # - P4 input index = 20
  # - P5 input index = 23
  - [[17, 20, 23], 1, OBB26, [nc, 1]] # 24 OBB26(P3, P4, P5)
