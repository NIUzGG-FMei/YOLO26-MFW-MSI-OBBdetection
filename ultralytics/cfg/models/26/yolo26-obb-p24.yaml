# Ultralytics YOLO26-obb Oriented Bounding Boxes (OBB) model with P2/4 - P4/16 outputs
# This variant removes the P5/32 detection branch and adds a P2/4 branch,
# while keeping the PAN (top-down + bottom-up) neck structure.
# The backbone still keeps the deep P5/32 features as the semantic source for the neck.
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/obb

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n-obb-p24.yaml' will call yolo26-obb-p24.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 307 layers, 1,934,190 parameters, 1,934,190 gradients, 9.4 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 307 layers, 7,201,470 parameters, 7,201,470 gradients, 27.6 GFLOPs
  m: [0.50, 1.00, 512] # summary: 327 layers, 16,868,094 parameters, 16,868,094 gradients, 95.4 GFLOPs
  l: [1.00, 1.00, 512] # summary: 467 layers, 21,539,326 parameters, 21,539,326 gradients, 119.3 GFLOPs
  x: [1.00, 1.50, 512] # summary: 467 layers, 48,347,646 parameters, 48,347,646 gradients, 265.9 GFLOPs


#  去掉p5 开p2


# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32 (kept as neck semantic source)
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [128, True]] # 19 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P3
  - [-1, 2, C3k2, [256, True]] # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 25 (P4/16-medium)

  - [[19, 22, 25], 1, OBB26, [nc, 1]] # OBB26(P2, P3, P4)
