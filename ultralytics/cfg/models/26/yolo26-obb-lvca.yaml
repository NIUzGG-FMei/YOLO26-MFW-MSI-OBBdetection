# Ultralytics YOLO26-obb Oriented Bounding Boxes (OBB) model with P3/8 - P5/32 outputs
# LVCA (Lightweight Voxel Coordinate Attention) 注意力模块, 插入在 backbone 深层特征输出端 (C2PSA 之后)
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/obb

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n-obb.yaml' will call yolo26-obb.yaml with scale 'n'
  # [depth, width, max_channels]
  # 深度系数depth会影响下面backbone中重复次数repeats的实际次数，
  # 例如[-1, 2, C3k2, [256, False, 0.25]] 的重复次数是round(2 * depth) = 1次 , round为四舍五入
  # 如果本身repeats 等于 1 ，四舍五入后还是 1 次
  # 宽度系数width会影响下面backbone中输出通道数的实际数，
  # 例如[-1, 2, C3k2, [256, False, 0.25]] 的输出通道数是256 * width
  n: [0.50, 0.25, 1024] # summary: 294 layers, 2,722,286 parameters, 2,722,286 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 294 layers, 10,607,774 parameters, 10,607,774 gradients, 24.8 GFLOPs
  m: [0.50, 1.00, 512] # summary: 314 layers, 23,619,550 parameters, 23,619,550 gradients, 82.8 GFLOPs
  l: [1.00, 1.00, 512] # summary: 426 layers, 28,023,006 parameters, 28,023,006 gradients, 101.2 GFLOPs
  x: [1.00, 1.50, 512] # summary: 426 layers, 62,868,558 parameters, 62,868,558 gradients, 226.2 GFLOPs



# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  # -1 表示取 上一层的输出作为输入
  # [-1,6] 表示取 上一层、第6层(起始第0层)的输出 的拼接 作为输入
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2     步长2下采样卷积
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4    步长2下采样卷积
  - [-1, 2, C3k2, [256, False, 0.25]] # 2  特征提炼
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8    步长2下采样卷积
  - [-1, 2, C3k2, [512, False, 0.25]] # 4  特征提炼
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16   步长2下采样卷积
  - [-1, 2, C3k2, [512, True]] # 6         特征提炼
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32  步长2下采样卷积
  - [-1, 2, C3k2, [1024, True]] # 8        特征提炼
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10
  - [-1, 1, LVCA, []] # 11  深层 backbone 注意力, 提前滤除大面积背景噪声

# YOLO26n head
head:
# [-1, 6]表示 取 上一层、第6层(即为 backbone C3k2)的输出 的拼接 作为输入

# Neck 12-17 走自顶向下，上采样高语义特征并与 backbone P4/P3 拼接
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 17 (P3/8-small)  put into OBB26

# Neck 18-23 再走自底向上，把增强后的小中尺度特征重新回流到 P4/P5 拼接
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 20 (P4/16-medium) put into OBB26

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23 (P5/32-large) put into OBB26

  - [[17, 20, 23], 1, OBB26, [nc, 1]] # OBB26(P3, P4, P5)
