#
# Dual-branch YOLO26 OBB for 8-channel multispectral inputs.
# - Spatial branch: full 8-channel input -> original YOLO26-style backbone
# - Spectral branch: full 8-channel input -> 1x1 spectral mixing + Conv downsampling + SpectralStage(MS_MSA)
# - Fusion: zero-initialized 1x1 gate
#   guided = spatial * (2.0 * sigmoid(conv1x1(spectral)))

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n-obb-dual-msmsa-guided-zerogate.yaml' will call this file with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, nn.Identity, []] # 0 preserve original 8-channel input for branch split

  # Spatial branch: same topology as the original YOLO26-OBB backbone, fed with full 8-channel input
  - [0, 1, Conv, [64, 3, 2]] # 1 spatial P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 2 spatial P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 3 spatial P2/4 feature extraction
  - [-1, 1, Conv, [256, 3, 2]] # 4 spatial P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 5 spatial P3/8 feature extraction
  - [-1, 1, Conv, [512, 3, 2]] # 6 spatial P4/16
  - [-1, 2, C3k2, [512, True]] # 7 spatial P4/16 feature extraction
  - [-1, 1, Conv, [1024, 3, 2]] # 8 spatial P5/32
  - [-1, 2, C3k2, [1024, True]] # 9 spatial P5/32 feature extraction

  # Spectral branch: same as guided-sigmoid baseline
  - [0, 1, SpectralInputMix, []] # 10 learnable 8-channel spectral mixing via 1x1 conv + BN + SiLU
  - [-1, 1, Conv, [64, 3, 2]] # 11 spectral P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 12 spectral P2/4
  - [-1, 2, SpectralStage, [256, 4, True]] # 13 spectral P2/4 MS_MSA stage with stable rescale init
  - [-1, 1, Conv, [256, 3, 2]] # 14 spectral P3/8
  - [-1, 2, SpectralStage, [512, 4, True]] # 15 spectral P3/8 MS_MSA stage with stable rescale init
  - [-1, 1, Conv, [512, 3, 2]] # 16 spectral P4/16
  - [-1, 2, SpectralStage, [512, 4, True]] # 17 spectral P4/16 MS_MSA stage with stable rescale init
  - [-1, 1, Conv, [1024, 3, 2]] # 18 spectral P5/32
  - [-1, 2, SpectralStage, [1024, 4, True]] # 19 spectral P5/32 MS_MSA stage with stable rescale init

  # Zero-initialized spectral-guided enhancement on the spatial branch outputs
  - [[5, 15], 1, GuidedEnhanceZeroInit, []] # 20 guided P3/8 = spatial * (2.0 * sigmoid(conv1x1(spectral)))
  - [[7, 17], 1, GuidedEnhanceZeroInit, []] # 21 guided P4/16 = spatial * (2.0 * sigmoid(conv1x1(spectral)))
  - [[9, 19], 1, GuidedEnhanceZeroInit, []] # 22 guided P5/32 = spatial * (2.0 * sigmoid(conv1x1(spectral)))
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 23 deep guided context aggregation
  - [-1, 2, C2PSA, [1024]] # 24 deep guided attention enhancement

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 21], 1, Concat, [1]] # cat guided backbone P4
  - [-1, 2, C3k2, [512, True]] # 27

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 20], 1, Concat, [1]] # cat guided backbone P3
  - [-1, 2, C3k2, [256, True]] # 30 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 27], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 33 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 24], 1, Concat, [1]] # cat deep guided P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 36 (P5/32-large)

  - [[30, 33, 36], 1, OBB26, [nc, 1]] # OBB26(P3, P4, P5)
