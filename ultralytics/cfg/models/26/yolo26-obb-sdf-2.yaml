# YOLO26-OBB with lightweight SDF-YOLO Sim-ACCoM and DIF modules, using P3/8 - P5/32 outputs.
# This adaptation omits Sim-ACCoM1 (no P2 detection head) and Sim-ACCoM4 (the P5 path reuses
# the C2PSA output directly instead of a deep Sim-ACCoM/DIF fusion).
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/obb

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # 2,946,598 parameters, 8.6 GFLOPs at imgsz=640
  s: [0.50, 0.50, 1024] # 11,398,022 parameters, 31.6 GFLOPs at imgsz=640
  m: [0.50, 1.00, 512] # 26,642,502 parameters, 108.3 GFLOPs at imgsz=640
  l: [1.00, 1.00, 512] # 31,259,974 parameters, 129.5 GFLOPs at imgsz=640
  x: [1.00, 1.50, 512] # 69,990,950 parameters, 288.4 GFLOPs at imgsz=640

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9-P5/32
  - [-1, 2, C2PSA, [1024]] # 10-P5/32 deep backbone output

  # SimACCoM args: [pos, kernel, dilations, depthwise, restore_kernel, sa_kernel, e_lambda]
  # Keep the paper's 7x7 kernels and [1,2,3,4] dilation schedule, but use depthwise branches.
  - [[2, 4, 6], 1, SimACCoM, [2, 7, [1, 2, 3, 4], True, 1, 7, 0.0001]] # 11-P3/8 enhanced
  - [[4, 6, 8], 1, SimACCoM, [3, 7, [1, 2, 3, 4], True, 1, 7, 0.0001]] # 12-P4/16 enhanced

# Neck and OBB head
head:
  # Top-down P5 -> P4: upsample the deep C2PSA feature, then concat the Sim-ACCoM-P4 (12).
  - [10, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 12], 1, Concat, [1]] # 14 cat Sim-ACCoM-P4
  - [-1, 2, C3k2, [512, True]] # 15-P4/16
  - [[-1, 12], 1, DIF, []] # 16-P4/16 fused (DIF channels are inferred from its two `from` entries)

  # Top-down P4 -> P3: upsample the C3k2 P4 feature (15), then concat the Sim-ACCoM-P3 (11).
  - [15, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 11], 1, Concat, [1]] # 18 cat Sim-ACCoM-P3
  - [-1, 2, C3k2, [256, True]] # 19-P3/8
  - [[-1, 11], 1, DIF, []] # 20-P3/8 small-object feature

  # Extra depth on the fused P3 branch: its output feeds both the OBB head (P3) and the bottom-up P4 path.
  # Placed before the bottom-up path because YOLO builds/executes layers sequentially (no forward refs).
  - [20, 2, C3k2, [256, True]] # 21-P3/8 enhanced small-object feature

  # Bottom-up PAN path starts from the enhanced P3 (21), then reuses the fused P4/P5 features
  # without adding duplicate DIF modules.
  - [21, 1, Conv, [256, 3, 2]] # 22-P4/16
  - [[-1, 16], 1, Concat, [1]] # 23 cat fused top-down P4
  - [-1, 2, C3k2, [512, True]] # 24-P4/16 medium-object feature

  - [-1, 1, Conv, [512, 3, 2]] # 25-P5/32
  - [[-1, 10], 1, Concat, [1]] # 26 cat deep P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 27-P5/32 large-object feature

  - [[21, 24, 27], 1, OBB26, [nc, 1]] # 28 OBB26(P3, P4, P5)
