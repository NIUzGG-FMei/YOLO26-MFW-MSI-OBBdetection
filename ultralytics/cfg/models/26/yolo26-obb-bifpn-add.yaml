# Ultralytics YOLO26-obb Oriented Bounding Boxes (OBB) model with P3/8 - P5/32 outputs
# Alternative single-layer BiFPN neck: keeps the original PAFPN top-down/bottom-up
# structure (Upsample + C3k2 + stride-2 Conv), replaces Concat with learnable
# BiFPN_Add2/BiFPN_Add3 weighted fusion and adds P4/P5 cross-node skip connections.
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/obb

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n-obb-bifpn-add.yaml' will call this file with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone (identical to yolo26-obb.yaml)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO26n head: original PAFPN topology with learnable-add BiFPN fusion nodes
head:
  # ---- Top-down path ----
  - [-1, 1, Conv, [1024, 1, 1]] # 11 P5_td (P5 top-down node for the P5 cross-node)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12 P5_td up to P4 scale
  - [[6, -1], 1, BiFPN_Add2, []] # 13 weighted add: P4 + up(P5_td)
  - [-1, 1, C3k2, [512, True]] # 14 P4_td

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15 P4_td up to P3 scale
  - [[4, -1], 1, BiFPN_Add2, []] # 16 weighted add: P3 + up(P4_td)
  - [-1, 1, C3k2, [256, True]] # 17 P3_out (P3/8-small for OBB26)

  # ---- Bottom-up path with cross-node skip connections ----
  - [-1, 1, Conv, [256, 3, 2]] # 18 P3_out down to P4 scale
  - [[6, 14, -1], 1, BiFPN_Add3, []] # 19 weighted add: P4 + P4_td + down(P3_out)
  - [-1, 1, C3k2, [512, True]] # 20 P4_out (P4/16-medium for OBB26)

  - [-1, 1, Conv, [512, 3, 2]] # 21 P4_out down to P5 scale
  - [[10, 11, -1], 1, BiFPN_Add3, []] # 22 weighted add: P5 + P5_td + down(P4_out)
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23 P5_out (P5/32-large for OBB26)

  - [[17, 20, 23], 1, OBB26, [nc, 1]] # 24 OBB26(P3, P4, P5)
